};

};

message: '<b>Jixy Brain Engine - NLP Architecture:</b><br><br>' +
'1. <b>Text Tokenization:</b> When you submit a prompt, I sanitize it (blocking XSS attacks) and split it into an array of alphanumeric tokens.<br><br>' +
'2. <b>Stop-Words Pruning:</b> I execute an optimization loop stripping away non-essential connector terms (like <i>\'the\', \'find\', \'open\'</i>) to isolate purely critical policy definitions.<br><br>' +
'3. <b>Algorithmic Scoring Matrix:</b> I scan the active Knowledge Base initialized by QA staff. I match tokens using a priority weight system:' +
'<ul style="padding-left:20px; margin-top:5px; margin-bottom:5px; line-height:1.5;">' +
'<li><b>Base Hit:</b> Title/URL containment yields <b>+10 points</b>.</li>' +
'<li><b>Tag Match:</b> Exact keyword tag matches grant a <b>+40 points</b> bonus.</li>' +

}

// 5. PLATFORM FAQ
const platformKeywords = /(what is flash assistant|purpose of this app|why.*use this|what.*platform|what.*app|flash assistant|o18|what.*tool|point of this|what.*application do)/i;
if (platformKeywords.test(q) && !q.includes("work") && !q.includes("function")) {

'It replaces chaotic, scattered spreadsheets and messy instant messaging rooms. It creates a direct, atomic, and synchronized communication loop between front-line Agents and the QA engineering staff for complex policy doubts, preventing data-loss and ensuring maximum transparency.'
};
}

};
}

// 7. GRAY AREAS
const grayAreaKeywords = /(gray area|grey area|edge case|permanent database|save.*forever|what is a grey area|when.*gray area|why mark as gray area|gray_area|grey_area)/i;

};
}

'If you escalate a Job ID that has already been submitted by another agent, the system intersects you into a "Blind Thread". You can submit your own analysis, but all rationale notes remain completely hidden from everyone until the QA staff issues the official verdict. This prevents "group-think" and cognitive bias during policy evaluation.'
};
}

// 9. ROW LOCKS
const lockKeywords = /(locked|row lock|lock badge|why.*locked|race condition|qa concurrency|3 minutes lock|who locked|can'?t edit|can'?t resolve|unlock)/i;

return {

'When a QA clicks \'Resolve\', the system assigns them a strict <b>3-minute lock</b> on that row. Other QA users will see a red lock badge and are blocked from modifying it. If the QA abandons the screen, the lock expires automatically after 3 minutes, releasing the ticket back to the team.'
};
}

// 10. AHT & TIMERS
const ahtKeywords = /(aht|timer|countdown|sla|expired|time limit|how much time|why.*timer|what happens.*expires|time is up|clock)/i;
if (ahtKeywords.test(q)) {
return {
type: 'chat',
message: 'The <b>AHT (Average Handling Time) Limit</b> is a live countdown rendered next to pending escalations in the queue.<br><br>' +
'It calculates the exact remaining window (usually 3 minutes) allocated for a QA to resolve the case. If the timer hits zero, it flashes \'EXPIRED\'. The QA administration panel can dynamically adjust this duration or hide it from agents in real-time.'
};
}

// 11. OFFLINE VAULT

if (offlineKeywords.test(q)) {
return {
type: 'chat',
message: 'Flash Assistant features a resilient <b>Offline Data Vault</b>.<br><br>' +
'If your corporate network connection drops, the app intercepts your ticket submissions, safely defers them into your browser\'s local sandbox (<code>localStorage</code>), and displays a red \'Offline Sync\' badge.<br><br>' +
'You can keep working. As soon as a stable internet ping is restored, the queue wakes up and automatically pipes all your offline tickets back to the main database one by one.'
};
}

// 12. BATCH PRUNING
const maintenanceKeywords = /(maintenance|deletion|system trigger|ttl|pruning|where are old tickets|do tickets get deleted|database cleanup|30 days|retention|how long.*kept|missing tickets|disappeared)/i;
if (maintenanceKeywords.test(q)) {
return {
type: 'chat',
message: 'To prevent data bloat and ensure Google Sheets operates within optimal memory limits, a server-side background trigger executes an <b>Automated Batch Pruning Routine</b>.<br><br>' +
'Every 5 minutes, it evaluates the main log in O(1) time complexity. Any ticket that has been marked \'RESOLVED\' for more than <b>30 days (TTL)</b> is permanently purged from the active queue. Only tickets marked as \'Gray Area\' survive this deletion.'
};
}

'1. Copy the exact <b>Job ID</b> from your tool and paste it into the identification input field.<br>' +
'2. Click the \'Policy Hypothesis\' dropdown and select what you suspect the violation is.<br>' +
'3. In the <b>Rationale</b> box, write at least 15 characters explaining *why* you are in doubt. Context is mandatory to help QA investigate efficiently.<br>' +
'4. Click <b>ESCALATE TO QA</b>.<br><br>' +

};

'<button class="btn-primary" id="jixy-fb-submit" style="margin-top:6px; font-size:12px; padding:8px; background:var(--warning); color:#000;" onclick="window.app.submitJixyFeedback()">Send to Dev Team</button>' +
'</div>'
