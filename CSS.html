<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
--bg-deep: #1d1d1d;
--glass-surface: rgba(15, 15, 15, 0.7);
--glass-border: rgba(255, 255, 255, 0.12);
--glass-shadow: 0 25px 90px rgba(0,0,0,0.6);
--input-bg: #0a0a0a;
--input-border: #555555;
--primary: #d4af37;
--primary-glow: rgba(212, 175, 55, 0.4);
--text-main: #ffffff;
--text-muted: #cccccc;
--text-inverse: #000000;
--text-label: #a0a0a0;
--success: #10b981;
--error: #ef4444;
--warning: #fbbf24;
--purple: #a855f7;
--bg-hover: rgba(255, 255, 255, 0.08);
--bg-active: rgba(255, 255, 255, 0.15);
--bg-panel: rgba(0, 0, 0, 0.4);
--border-solid: #555555;
--border-light: rgba(255, 255, 255, 0.08);
--overlay-bg: rgba(0, 0, 0, 0.85);
--font-display: 'Cinzel', serif;
--font-sans: 'Inter', sans-serif;
--font-mono: 'JetBrains Mono', monospace;
}

[data-theme="light"] {
--bg-deep: #c0c1c2;
--glass-surface: rgba(255, 255, 255, 0.85);
--glass-border: rgba(0, 0, 0, 0.1);
--glass-shadow: 0 10px 40px rgba(0,0,0,0.1);
--input-bg: #ffffff;
--input-border: #cbd5e1;
--primary: #b48500;
--primary-glow: rgba(180, 133, 0, 0.3);
--text-main: #1f2937;
--text-muted: #4b5563;
--text-inverse: #ffffff;
--text-label: #374151;
--bg-hover: rgba(0, 0, 0, 0.05);
--bg-active: rgba(0, 0, 0, 0.1);
--bg-panel: rgba(255, 255, 255, 0.6);
--border-solid: #9ca3af;
--border-light: rgba(0, 0, 0, 0.1);
--overlay-bg: rgba(255, 255, 255, 0.8);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); background-color: var(--bg-deep); color: var(--text-main); min-height: 100vh; overflow-x: hidden; transition: background-color 0.3s ease, color 0.3s ease; }
.font-mono { font-family: var(--font-mono); }

.background-orbs { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; z-index: -1; pointer-events: none; }
.orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.15; animation: float 20s infinite alternate ease-in-out; }
.orb-1 { width: 400px; height: 400px; background: var(--primary); top: -100px; left: -100px; }
.orb-2 { width: 500px; height: 500px; background: var(--warning); bottom: -150px; right: -100px; animation-delay: -5s; }
.orb-3 { width: 300px; height: 300px; background: var(--success); top: 40%; left: 50%; transform: translate(-50%, -50%); opacity: 0.05; animation-duration: 25s; }
@keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 30px) scale(1.1); } }

.container { max-width: 1650px; width: 96%; margin: 0 auto; padding: 2rem; display: flex; flex-direction: column; gap: 2rem; }

.app-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1.5rem; border-bottom: 1px solid var(--glass-border); }
.app-header h1 { font-family: var(--font-display); font-size: 1.75rem; letter-spacing: 1px; display: flex; align-items: center; gap: 12px; color: var(--text-main); }
.glass-badge { background: var(--glass-surface); border: 1px solid var(--glass-border); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; color: var(--text-main); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 8px var(--success); animation: pulse 2s infinite; }
.icon-btn { background: var(--glass-surface); border: 1px solid var(--glass-border); color: var(--text-main); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
.icon-btn:hover { background: var(--bg-hover); transform: translateY(-2px); border-color: var(--primary); color: var(--primary); }
.icon-btn:active { transform: scale(0.92); }

.glass-panel { background: var(--glass-surface); border: 1px solid var(--glass-border); border-radius: 16px; padding: 2rem; box-shadow: var(--glass-shadow); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
.animate-entry { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both; opacity: 0; transform: translateY(20px); }
@keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 1.5rem; }
.form-group { display: flex; flex-direction: column; gap: 8px; }
.form-group label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-label); }
input[type="text"], input[type="number"], textarea, select { width: 100%; padding: 12px 16px; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px; color: var(--text-main); font-family: var(--font-sans); font-size: 15px; transition: all 0.2s; outline: none; }
input[type="text"]:focus, input[type="number"]:focus, textarea:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-glow); }
textarea { resize: vertical; min-height: 46px; }
#settings-emails { background-color: var(--input-bg); background-image: repeating-linear-gradient(transparent, transparent 27px, var(--border-light) 27px, var(--border-light) 28px); line-height: 28px; padding: 6px 12px; background-attachment: local; resize: vertical; }

button { font-family: var(--font-sans); font-weight: 600; border-radius: 8px; cursor: pointer; transition: all 0.15s ease; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; outline: none; }
.btn-primary { background: var(--primary); color: var(--text-inverse); padding: 12px 24px; font-size: 15px; box-shadow: 0 4px 15px var(--primary-glow); text-transform: uppercase; letter-spacing: 0.5px; }
.btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px var(--primary-glow); filter: brightness(1.1); }
.btn-primary:active:not(:disabled) { transform: translateY(1px) scale(0.96); box-shadow: 0 2px 10px var(--primary-glow); }
.btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }
.btn-secondary { background: var(--bg-hover); color: var(--text-main); border: 1px solid var(--border-solid); padding: 10px 20px; font-size: 14px; }
.btn-secondary:hover:not(:disabled) { background: var(--bg-active); border-color: var(--text-muted); }
.btn-secondary:active:not(:disabled) { transform: scale(0.95); background: var(--border-solid); }
.btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-park { background: rgba(168, 85, 247, 0.1); border: 1px solid var(--purple); color: var(--purple); padding: 12px 24px; font-size: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
.btn-park:hover:not(:disabled) { background: var(--purple); color: #000; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4); transform: translateY(-2px); }
.btn-park:active:not(:disabled) { transform: scale(0.96); box-shadow: 0 2px 8px rgba(168, 85, 247, 0.4); }
.btn-park:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-add-analysis { background: transparent; border: 1px dashed var(--border-solid); color: var(--text-main); padding: 6px 12px; font-size: 12px; }
.btn-add-analysis:hover:not(:disabled) { border-color: var(--warning); color: var(--warning); background: rgba(251, 191, 36, 0.05); }
.btn-add-analysis:active:not(:disabled) { transform: scale(0.93); }

.btn-resolve { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--primary); color: var(--primary); padding: 6px 12px; font-size: 12px; }
.btn-resolve:hover:not(:disabled) { background: var(--primary); color: var(--text-inverse); }
.btn-resolve:active:not(:disabled) { transform: scale(0.93); }
.btn-resolve:disabled { opacity: 0.5; cursor: not-allowed; border-color: var(--border-solid); color: var(--text-muted); background: transparent; }
.btn-view-thread { background: var(--bg-hover); border: 1px solid var(--border-light); color: var(--text-main); padding: 6px 12px; font-size: 12px; }
.btn-view-thread:hover:not(:disabled) { background: var(--bg-active); border-color: var(--border-solid); }
.btn-view-thread:active:not(:disabled) { transform: scale(0.93); }

.btn-copy-inline { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 4px; margin-left: 6px; border-radius: 4px; display: inline-flex; align-items: center; transition: all 0.2s; vertical-align: middle; }
.btn-copy-inline:hover { color: var(--primary); background: var(--bg-hover); }
.btn-copy-inline:active { transform: scale(0.9); }
.btn-copy-inline.copied { color: var(--success); }

.switch { position: relative; display: inline-block; width: 44px; height: 24px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-solid); transition: .4s; border-radius: 34px; border: 1px solid var(--border-light); }
.slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: var(--text-muted); transition: .4s; border-radius: 50%; }
input:checked + .slider { background-color: rgba(251, 191, 36, 0.2); border-color: var(--warning); }
input:checked + .slider:before { transform: translateX(20px); background-color: var(--warning); box-shadow: 0 0 5px var(--warning); }

.ms-container { position: relative; width: 100%; }
.ms-selection-area { min-height: 46px; padding: 6px 12px; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; cursor: pointer; transition: all 0.2s; }
.ms-selection-area.active { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-glow); }
.ms-placeholder { color: var(--text-muted); opacity: 0.7; font-size: 15px; padding: 4px; }
.ms-tag { background: var(--bg-active); border: 1px solid var(--border-solid); color: var(--text-main); padding: 4px 8px; border-radius: 6px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; }
.ms-dropdown { position: absolute; top: calc(100% + 4px); left: 0; width: 100%; max-height: 250px; overflow-y: auto; background: var(--input-bg); border: 1px solid var(--border-solid); border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 100; opacity: 0; visibility: hidden; transform: translateY(-10px); transition: all 0.2s; }
.ms-dropdown.show { opacity: 1; visibility: visible; transform: translateY(0); }
.ms-option { padding: 10px 16px; font-size: 14px; cursor: pointer; border-bottom: 1px solid var(--border-light); transition: background 0.1s; }
.ms-option:last-child { border-bottom: none; }
.ms-option:hover { background: var(--bg-hover); color: var(--primary); padding-left: 20px; }

.table-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.5rem; }
.table-wrapper { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border-light); background: var(--bg-panel); }
table { width: 100%; border-collapse: collapse; text-align: left; }
th, td { padding: 16px; border-bottom: 1px solid var(--border-light); }
th { background: rgba(0, 0, 0, 0.2); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-label); white-space: nowrap; position: sticky; top: 0; z-index: 10; }
tr:last-child td { border-bottom: none; }
tbody tr { transition: background-color 0.2s; }
tbody tr:hover { background-color: var(--bg-hover); }
.highlight-match { animation: highlightRow 2s ease-out; }
@keyframes highlightRow { 0% { background-color: rgba(212, 175, 55, 0.2); } 100% { background-color: transparent; } }

.row-locked { opacity: 0.6; pointer-events: none; }
.lock-badge { background: rgba(239, 68, 68, 0.1); color: var(--error); border: 1px solid rgba(239, 68, 68, 0.3); padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px; display: inline-block; }

.timer-active { color: var(--warning); font-weight: bold; }
.timer-expired { color: var(--error); font-weight: bold; animation: pulse-error 2s infinite; }

.pulse-container { display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid transparent; }
.pulse-dot { width: 8px; height: 8px; border-radius: 50%; }
.pulse-pending { background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.2); color: var(--warning); }
.pulse-pending .pulse-dot { background: var(--warning); animation: pulse-warning 2s infinite; }
.pulse-parked { background: rgba(168, 85, 247, 0.1); border-color: rgba(168, 85, 247, 0.2); color: var(--purple); }
.pulse-parked .pulse-dot { background: var(--purple); animation: pulse-parked-anim 2s infinite; }
.pulse-safe { background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.2); color: var(--success); }
.pulse-safe .pulse-dot { background: var(--success); box-shadow: 0 0 8px var(--success); }
.pulse-violation { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: var(--error); }
.pulse-violation .pulse-dot { background: var(--error); box-shadow: 0 0 8px var(--error); }

@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
@keyframes pulse-warning { 0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(251, 191, 36, 0); } 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); } }
@keyframes pulse-error { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
@keyframes pulse-parked-anim { 0% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(168, 85, 247, 0); } 100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); } }

.modal-backdrop { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--overlay-bg); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal-content { background: var(--glass-surface); border: 1px solid var(--border-solid); border-radius: 16px; width: 90%; max-width: 850px; padding: 2rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
@keyframes modalPop { 0% { opacity: 0; transform: scale(0.95) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
#gray-area-modal .modal-content { height: 85vh; padding: 1.5rem; }
#gray-area-table-body td { font-size: 14px; }
#gray-area-policy-filter { font-family: var(--font-sans); }

.job-id-cell { display: inline-flex; align-items: center; gap: 8px; max-width: 280px; overflow: hidden; }
.job-id-text { display: inline-block; max-width: calc(100% - 58px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: middle; }
#qa-note-job-id, #eval-job-id { display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.timeline { position: relative; padding-left: 40px; margin-top: 10px; padding-bottom: 10px; }
.timeline::before { content: ''; position: absolute; left: 21px; top: 8px; bottom: 10px; width: 2px; background: var(--border-solid); border-radius: 2px; }
.timeline-item { position: relative; margin-bottom: 25px; }
.timeline-item:last-child { margin-bottom: 0; }
.timeline-dot { position: absolute; left: -25px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); border: 2px solid var(--bg-deep); }
.timeline-content { background: var(--bg-panel); border: 1px solid var(--border-light); border-radius: 8px; padding: 16px; }
.qa-response .timeline-dot { background: var(--success); width: 14px; height: 14px; left: -27px; top: 2px; box-shadow: 0 0 8px var(--success); }
.qa-response .timeline-content { border-color: var(--primary); background: rgba(212, 175, 55, 0.05); }

.settings-tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 1px solid var(--border-light); padding-bottom: 10px; overflow-x: auto; }
.tab-folder { background: transparent; border: none; color: var(--text-muted); padding: 8px 16px; cursor: pointer; font-size: 14px; font-weight: bold; border-radius: 6px; transition: all 0.2s; white-space: nowrap; }
.tab-folder:hover { background: var(--bg-hover); color: var(--text-main); }
.tab-folder.active { background: var(--primary); color: #000; }
.settings-tab-content { display: none; animation: fadeIn 0.3s ease; }
.settings-tab-content.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

.kb-tags-wrapper { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 12px; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 8px; min-height: 42px; align-items: center; cursor: text; }
.kb-tag-input { background: transparent; border: none; color: var(--text-main); font-size: 13px; outline: none; flex: 1; min-width: 120px; padding: 4px 0; }
.kb-tag { background: rgba(212, 175, 55, 0.15); border: 1px solid var(--primary); color: var(--primary); padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 10px var(--primary-glow); }
.kb-tag-remove { cursor: pointer; color: var(--text-main); opacity: 0.7; transition: opacity 0.2s; font-size: 14px; }
.kb-tag-remove:hover { opacity: 1; color: var(--error); }

.jixy-widget-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; }
#ai-toggle-btn { width: 65px; height: 65px; border-radius: 50%; background: var(--primary); border: none; cursor: pointer; box-shadow: 0 4px 15px var(--primary-glow); display: flex; justify-content: center; align-items: center; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); animation: float-bot 3s infinite ease-in-out; outline: none; z-index: 2; }
#ai-toggle-btn:hover { transform: scale(1.1); box-shadow: 0 6px 20px var(--primary-glow); filter: brightness(1.1); }
@keyframes float-bot { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.ai-face { display: flex; gap: 8px; }
.ai-eye { width: 14px; height: 18px; background: #fff; border-radius: 50px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
.ai-pupil { width: 8px; height: 8px; background: #000; border-radius: 50%; transition: transform 0.1s ease-out; }
.jixy-floating-hint { position: absolute; right: 80px; bottom: 15px; background: var(--glass-surface); border: 1px solid var(--primary); padding: 8px 16px; border-radius: 20px; color: var(--text-main); font-size: 13px; font-weight: bold; white-space: nowrap; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); pointer-events: none; opacity: 0; animation: showAndHideHint 8s forwards; }
@keyframes showAndHideHint { 0%, 20% { opacity: 0; transform: translateX(20px); } 25% { opacity: 1; transform: translateX(0); } 80% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(20px); visibility: hidden; } }
.jixy-chat-panel { position: absolute; bottom: 85px; right: 0; width: 350px; height: 480px; display: flex; flex-direction: column; padding: 0; overflow: hidden; transform-origin: bottom right; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); box-shadow: 0 20px 40px rgba(0,0,0,0.5); border-color: var(--primary); z-index: 1; }
.jixy-chat-panel.ai-hidden { opacity: 0; transform: scale(0.5); pointer-events: none; visibility: hidden; }
.jixy-header { background: rgba(0,0,0,0.4); padding: 15px; border-bottom: 1px solid var(--border-light); font-size: 15px; display: flex; align-items: center; gap: 10px; color: var(--primary); border-top-left-radius: 16px; border-top-right-radius: 16px; }
[data-theme="light"] .jixy-header { background: #000000; }
.ai-face-mini { display: flex; gap: 4px; background: var(--primary); padding: 4px 6px; border-radius: 10px; }
.ai-face-mini .ai-pupil { background: #000; width: 4px; height: 6px; border-radius: 2px; }
.jixy-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; animation: msgPop 0.3s ease; word-wrap: break-word; word-break: break-word; }
@keyframes msgPop { 0% { opacity: 0; transform: scale(0.9) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
.msg-bot { background: rgba(212, 175, 55, 0.1); border: 1px solid var(--primary); color: var(--text-main); align-self: flex-start; border-bottom-left-radius: 2px; }
.msg-user { background: var(--bg-hover); border: 1px solid var(--border-solid); color: var(--text-main); align-self: flex-end; border-bottom-right-radius: 2px; }
.jixy-chips { padding: 0 15px 10px 15px; display: flex; flex-wrap: wrap; gap: 6px; }
.jixy-chip { background: transparent; border: 1px solid var(--border-solid); color: var(--text-muted); font-size: 11px; padding: 4px 10px; border-radius: 12px; cursor: pointer; transition: all 0.2s; }
.jixy-chip:hover { border-color: var(--primary); color: var(--primary); }
.jixy-input-area { display: flex; padding: 15px; border-top: 1px solid var(--border-light); background: rgba(0,0,0,0.2); gap: 8px; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; }
.jixy-input-area input { flex: 1; padding: 10px; font-size: 13px; height: 40px; }
.jixy-send-btn { padding: 0 15px; height: 40px; font-size: 13px; min-width: auto; }
.ai-typing-indicator { display: flex; gap: 4px; padding: 4px; }
.ai-dot { width: 6px; height: 6px; background: var(--primary); border-radius: 50%; animation: typing 1.4s infinite ease-in-out both; }
.ai-dot:nth-child(1) { animation-delay: -0.32s; }
