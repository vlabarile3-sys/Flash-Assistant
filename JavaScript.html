    saveSettings() {
        const btn = document.getElementById('settings-save-btn');
        if(!btn) return;
        const origText = btn.innerHTML;
        btn.disabled = true; btn.innerHTML = 'SAVING...';
        this._pausePolling();
        
        const kbRows = this.dom.jixyKbContainer.querySelectorAll('.jixy-kb-row'); const updatedKB = [];
        kbRows.forEach(row => {
            const t = row.querySelector('.kb-title').value.trim(); const u = row.querySelector('.kb-url').value.trim();
            const kwArray = Array.from(row.querySelectorAll('.kb-tag > span:first-child')).map(span => span.textContent.trim().toLowerCase());
            if (t && u) { updatedKB.push({ title: t, url: u, keywords: kwArray }); }
        });

        const policyCardsDOM = document.getElementById('settings-policies-container').querySelectorAll('.policy-category-card');
        const grouped = {};
        const visibilityMap = {};
        
        policyCardsDOM.forEach(card => {
            const catName = card.querySelector('.cat-name').value.trim() || 'General';
            const isVis = card.querySelector('.btn-toggle-vis').getAttribute('data-visible') === 'true';
            
            visibilityMap[catName] = isVis;

            if (!grouped[catName]) grouped[catName] = {};

            const mediaRows = card.querySelectorAll('.policy-media-row');
            
            mediaRows.forEach(row => {
                const medType = row.querySelector('.media-select').value || 'All';
                const polArray = Array.from(row.querySelectorAll('.kb-tag > span:first-child')).map(span => span.textContent.trim());

                if (polArray.length > 0) {
                    if (!grouped[catName][medType]) grouped[catName][medType] = [];
                    for(let i=0; i<polArray.length; i++){
                       grouped[catName][medType].push(polArray[i]);
                    }
                }
            });
        });

        const updatedPolicies = Object.keys(grouped).map(cat => {
            return {
                category: cat,
                isVisible: visibilityMap[cat],
                media: Object.keys(grouped[cat]).map(med => {
                    const uniquePol = [];
                    const tempSet = new Set();
                    grouped[cat][med].forEach(p => {
                        if (!tempSet.has(p)) { tempSet.add(p); uniquePol.push(p); }
                    });
                    return { type: med, policies: uniquePol };
                })
            };
        });

        const data = { 
            qaEmails: document.getElementById('settings-emails') ? document.getElementById('settings-emails').value : '', 
            policies: updatedPolicies, 
            countdownDuration: document.getElementById('settings-cd-duration') ? document.getElementById('settings-cd-duration').value : 3, 
            countdownVisibility: document.getElementById('settings-cd-visibility') ? document.getElementById('settings-cd-visibility').checked : true, 
            jixyKB: updatedKB 
        };
        
        google.script.run.withSuccessHandler(res => {
            btn.disabled = false; btn.innerHTML = origText;
            this.utils.toggleModal('settings-modal', false); this.utils.showToast("Settings & Knowledge Base Saved", "success");
            this.state.user.jixyKB = updatedKB; 
            this.state.isFetching = false;
            this.fetchTableData(1, "", true);
        }).withFailureHandler(e => { btn.disabled = false; btn.innerHTML = origText; this.utils.onFailure(e); }).saveAdminSettings(data);
    }

    playNotificationSound() {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            
            if (ctx.state === 'suspended') {
                ctx.resume();
            }

            const osc = ctx.createOscillator();
            const gainNode = ctx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
            
            osc.connect(gainNode);
            gainNode.connect(ctx.destination);
            
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        } catch(e) {
            console.warn("Audio synthesizer blocked by browser:", e);
        }
    }

    checkJixyAlerts(data) {
        if (!data || data.length === 0) return;
        
        if (this.state.lastQaAlertTime === null) {
            let maxQa = 0;
            let maxAgent = 0;
            data.forEach(r => {
                const t = new Date(r.timestamp).getTime();
                if(t > maxQa) maxQa = t;
                if(r.status.startsWith('RESOLVED|')) {
                    const resT = parseInt(r.status.split('|')[1], 10);
                    if(resT > maxAgent) maxAgent = resT;
                }
            });
            this.state.lastQaAlertTime = maxQa || Date.now();
            this.state.lastAgentAlertTime = maxAgent || Date.now();
            return; 
        }

        let newQaTime = this.state.lastQaAlertTime; 
        let newAgentTime = this.state.lastAgentAlertTime;
        let newQaTickets = []; 
        let newAgentTickets = [];
        
        data.forEach(row => {
            if (this.state.user.isQa && row.status === 'PENDING_QA') {
                const ticketTime = new Date(row.timestamp).getTime();
                if (ticketTime > this.state.lastQaAlertTime) { 
                    newQaTickets.push({ jobId: row.jobId, time: ticketTime }); 
                    if (ticketTime > newQaTime) newQaTime = ticketTime; 
                }
            }
            if (!this.state.user.isQa && row.status.startsWith('RESOLVED')) {
                const resTime = parseInt(row.status.split('|')[1], 10); 
                let raters = []; try { raters = JSON.parse(row.raters); } catch(e){}
                if (raters.some(r => r.ldap === this.state.user.ldap)) {
                    if (resTime > this.state.lastAgentAlertTime) { 
                        newAgentTickets.push({ jobId: row.jobId, time: resTime }); 
                        if (resTime > newAgentTime) newAgentTime = resTime; 
                    }
                 }
            }
        });
        
        if (newQaTickets.length > 0) { 
            this.state.lastQaAlertTime = newQaTime; 
            localStorage.setItem('flash-assistant-qa-time', newQaTime.toString()); 
            this.triggerJixySecretary({ type: 'qa_alert', tickets: newQaTickets }); 
        }
        if (newAgentTickets.length > 0) { 
            this.state.lastAgentAlertTime = newAgentTime; 
            localStorage.setItem('flash-assistant-agent-time', newAgentTime.toString()); 
            this.triggerJixySecretary({ type: 'agent_alert', tickets: newAgentTickets }); 
        }
    }

    triggerJixySecretary(reminders) {

        this.dom.aiChatWindow.classList.remove('ai-hidden');
        this.dom.aiInput.focus(); this.dom.aiToggleBtn.style.transform = 'scale(0.9)'; this.dom.aiToggleBtn.style.animationPlayState = 'paused'; this.state.jixyGreeted = true; 
        let msg = "";
        
        if (reminders.type === 'qa_alert') {
            msg = 'Alert! &#x1F4E2;<br><br><b>' + reminders.tickets.length + ' new ticket(s)</b> have been escalated:<br><br>';
            reminders.tickets.forEach(t => {
                let timeStr = new Date(t.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                let cleanJobId = this.utils.escapeHtml(t.jobId.split('\n\n---')[0].trim());
                msg += '<div style="margin-bottom:8px; padding:8px; background:rgba(255,255,255,0.05); border:1px solid var(--border-light); border-radius:6px; font-size:13px; word-break: break-all;"><b>Job ID:</b> ' + cleanJobId + '<br><span style="color:var(--text-muted); font-size:11px;">&#x23F0; Inserted at ' + timeStr + '</span><br><a href="#" onclick="event.preventDefault(); window.searchFromJixy(\'' + cleanJobId + '\')" style="color:var(--primary); text-decoration:none; font-weight:bold; display:inline-block; margin-top:6px;">&#x1F50D; Click here to view</a></div>';
            });
        } else if (reminders.type === 'agent_alert') {
            msg = 'Update! &#x2705;<br><br>The QA just resolved your ticket(s):<br><br>';
            reminders.tickets.forEach(t => {
                let timeStr = new Date(t.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                let cleanJobId = this.utils.escapeHtml(t.jobId.split('\n\n---')[0].trim());
                msg += '<div style="margin-bottom:8px; padding:8px; background:rgba(255,255,255,0.05); border:1px solid var(--border-light); border-radius:6px; font-size:13px; word-break: break-all;"><b>Job ID:</b> ' + cleanJobId + '<br><span style="color:var(--text-muted); font-size:11px;">&#x23F0; Resolved at ' + timeStr + '</span><br><a href="#" onclick="event.preventDefault(); window.searchFromJixy(\'' + cleanJobId + '\')" style="color:var(--success); text-decoration:none; font-weight:bold; display:inline-block; margin-top:6px;">&#x1F50D; Click here to view</a></div>';
            });
        }
        
        const typingHtml = '<div class="ai-typing-indicator"><div class="ai-dot"></div><div class="ai-dot"></div><div class="ai-dot"></div></div>';
        const loadId = this.addMessage(typingHtml, 'bot', true);
        setTimeout(() => { this.removeMessage(loadId); this.handleAiResponse({ type: 'chat', message: msg }); }, 1000);
    }

    sendAiMessage() {
        if(!this.dom.aiInput) return;
        const text = this.dom.aiInput.value.trim();
        if (!text) return;
        
        this.addMessage(this.utils.escapeHtml(text), 'user'); 
        this.dom.aiInput.value = '';
        
        const typingHtml = '<div class="ai-typing-indicator"><div class="ai-dot"></div><div class="ai-dot"></div><div class="ai-dot"></div></div>';
        const loadId = this.addMessage(typingHtml, 'bot', true);
        setTimeout(() => { this.removeMessage(loadId); this.handleAiResponse(this.processAILogic(text)); }, 600);
    }
    
    processAILogic(query) {
        if (window.JixyFAQEngine) {
            const genericMatch = window.JixyFAQEngine.getGenericResponse(query);
            if (genericMatch) {
                return genericMatch;
            }
        }

        const q = query.toLowerCase().trim();
        const stopWords = ['the','find','search','open','and','or','e','o','cerca','trova','apri','give','me','show','for','di','per','please','link','a','to','url'];
        
        const rawTokens = q.replace(/[^a-z0-9\s]/g, '').split(/\s+/);
        let searchTokens = rawTokens.filter(w => w.length > 1 && !stopWords.includes(w));
        
        if (searchTokens.length === 0) { 
            searchTokens = rawTokens.filter(w => w.length > 1);
            if (searchTokens.length === 0) {
                return { type: 'chat', message: "Can you be specific? Type a keyword." };
            }
        }
        
        const kb = this.state.user.jixyKB || []; 
        if (kb.length === 0) {
            return { type: 'chat', message: "My Knowledge Base is currently empty." };
        }
        
        const scoredDocs = kb.map(doc => { 
            let score = 0; 
            let matchCount = 0; 
            const docText = (doc.title + ' ' + (doc.keywords||[]).join(' ') + ' ' + doc.url).toLowerCase();
            
            searchTokens.forEach(t => { 
                if (docText.includes(t)) { 
                    score += 10; 
                    matchCount++; 
                    if ((doc.keywords||[]).some(kw => kw === t || kw.includes(t))) score += 40; 
                } 
            }); 
            
            if ((doc.keywords||[]).some(kw => q.includes(kw))) { 
                score += 100; 
                matchCount++; 
            }
            return { title: doc.title, url: doc.url, score: score, matchCount: matchCount }; 
        });
        
        let filteredDocs = scoredDocs.filter(d => d.matchCount > 0).sort((a, b) => b.score - a.score).slice(0, 3);
        
        if (filteredDocs.length > 0 && ['apri', 'open', 'launch', 'abre'].some(k => q.includes(k))) { 
            return { 
                type: 'action', 
                action: 'open_url', 
                url: filteredDocs[0].url, 
                message: 'Opening <b>' + this.utils.escapeHtml(filteredDocs[0].title) + '</b>...' 
            }; 
        }
        
        if (filteredDocs.length > 0) {
            return { type: 'results', data: filteredDocs, message: "Here is what I found for you:" };
        }
        
        return { type: 'chat', message: "Sorry, I couldn't find anything matching <b>'" + searchTokens.join(', ') + "'</b> in my database." };
    }

    handleAiResponse(res) {
        if (res.type === 'action' && res.action === 'open_url') { this.addMessage(res.message, 'bot'); setTimeout(() => window.open(res.url, '_blank'), 1000); } 
        else if (res.type === 'results') {
            this.addMessage(res.message, 'bot');
            if(this.dom.aiMessages) {
                res.data.forEach(item => { 
                    const div = document.createElement('div'); div.className = 'result-card-ai'; 
                    div.innerHTML = '<span class="res-title">&#x1F517; ' + this.utils.escapeHtml(item.title) + '</span>'; 
                    div.onclick = () => window.open(item.url, '_blank'); this.dom.aiMessages.appendChild(div); 
                });
            }
            this.scrollToBottom();
        } else { this.addMessage(res.message, 'bot'); }
    }
    
    addMessage(t, s, tmp = false) { 
        if(!this.dom.aiMessages) return;
        const div = document.createElement('div'); div.className = 'msg msg-' + s; div.innerHTML = t; if (tmp) div.id = 'ai-temp-' + Date.now(); this.dom.aiMessages.appendChild(div); this.scrollToBottom(); return div.id; 
    }
    
    removeMessage(id) { const el = document.getElementById(id); if (el) el.remove(); }
    
    scrollToBottom() { if(this.dom.aiMessages) setTimeout(() => this.dom.aiMessages.scrollTop = this.dom.aiMessages.scrollHeight, 50); }

    // ------------------------------------------------------------------------
    // JIXY FEEDBACK ENGINE - PASTE INTERCEPTOR & DATA DISPATCH
    // ------------------------------------------------------------------------
    handleFeedbackPaste(e, targetInput) {
        const items = (e.clipboardData || window.clipboardData).items;
        let imageItem = null;
        for (let i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image/') === 0) {
                imageItem = items[i];
                break;
            }
        }
        if (imageItem) {
            e.preventDefault(); 
            const file = imageItem.getAsFile();
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                this.state.jixyFeedbackImage = {
                    base64: event.target.result,
                    mimeType: file.type || 'image/png',
                    fileName: "Jixy_Lens_" + Date.now() + ".png"
                };
                targetInput.value = "📸 Screenshot captured! Ready to submit.";
                targetInput.style.color = "var(--success)";
                targetInput.style.fontWeight = "bold";
                targetInput.readOnly = true;
                this.utils.showToast("Screenshot loaded into memory.", "success");
            };
            reader.readAsDataURL(file);
        }
    }

    submitJixyFeedback() {
        const issueInput = document.getElementById('jixy-fb-issue');
        const solutionInput = document.getElementById('jixy-fb-solution');
        const screenshotInput = document.getElementById('jixy-fb-screenshot');
        const btnSubmit = document.getElementById('jixy-fb-submit');

        if (!issueInput || !btnSubmit) return;

        const issue = issueInput.value.trim();
        const solution = solutionInput ? solutionInput.value.trim() : '';

        if (!issue) {
            this.utils.showToast("Please describe the issue or suggestion.", "warning");
            return;
        }

        const origText = btnSubmit.innerHTML;
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = 'TRANSMITTING...';

        const payload = {
            issue: issue,
            solution: solution,
            ldap: this.state.user.ldap,
            imageBase64: this.state.jixyFeedbackImage ? this.state.jixyFeedbackImage.base64 : null,
            mimeType: this.state.jixyFeedbackImage ? this.state.jixyFeedbackImage.mimeType : null,
            fileName: this.state.jixyFeedbackImage ? this.state.jixyFeedbackImage.fileName : null
        };

        google.script.run.withSuccessHandler(res => {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = origText;
            if (res.success) {
                this.utils.showToast("Feedback sent directly to dev team!", "success");
                issueInput.value = '';
                if(solutionInput) solutionInput.value = '';
                if(screenshotInput) {
                    screenshotInput.value = '';
                    screenshotInput.readOnly = false;
                    screenshotInput.style.color = '';
                    screenshotInput.style.fontWeight = '';
                }
                this.state.jixyFeedbackImage = null;
                this.addMessage("Thank you! Your feedback has been safely transmitted to my creator's matrix. 🛠️", 'bot');
            } else {
                this.utils.showToast(res.message, "error");
            }
        }).withFailureHandler(e => {
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = origText;
            this.utils.onFailure(e);
        }).saveJixyFeedback(payload);
    }
  }

  const app = new AppManager();
  window.app = app;
  
  window.toggleAI = () => app.toggleAI();
  window.handleAiEnter = (e) => app.handleAiEnter(e);
  window.sendAiMessage = () => app.sendAiMessage();
  window.sendQuickAiMessage = (txt) => app.sendQuickAiMessage(txt);
  window.searchFromJixy = (jobId) => app.triggerSearchFromJixy(jobId);
  
  window.switchSettingsFolder = (folderId) => {
      const modal = document.getElementById('settings-modal'); if(!modal) return;
      modal.querySelectorAll('.tab-folder').forEach(tab => tab.classList.remove('active'));
      modal.querySelectorAll('.settings-tab-content').forEach(content => content.classList.remove('active'));
      const event = window.event; if (event && event.currentTarget) { event.currentTarget.classList.add('active'); }
      const target = document.getElementById(folderId); if (target) { target.classList.add('active'); }
  };
  
  window.switchHelpFolder = (folderId) => {
      const modal = document.getElementById('help-modal'); if(!modal) return;
      modal.querySelectorAll('.tab-folder').forEach(tab => tab.classList.remove('active'));
      modal.querySelectorAll('.settings-tab-content').forEach(content => content.classList.remove('active'));
      const event = window.event; if (event && event.currentTarget) { event.currentTarget.classList.add('active'); }
      const target = document.getElementById(folderId); if (target) { target.classList.add('active'); }
  };
  
  document.addEventListener('DOMContentLoaded', function() { app.init(); });
  
  window.copyTextToClipboard = function(text, btn) {
    if (!text) return;
    navigator.clipboard.writeText(text).then(function() {
      if (window.showCopyFeedback) window.showCopyFeedback(btn);
    }).catch(function(err) {
      console.error('Failed to copy text: ', err);
    });
  };

  window.showCopyFeedback = function(btn) {
    if (!btn) return;
    const originalHTML = btn.innerHTML;
    btn.classList.add('copied');
    if (btn.innerText.includes('Copy')) {
      btn.innerHTML = '&#x2714;&#xFE0F; Copied!';
    } else {
      btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
    }
    setTimeout(function() {
      btn.classList.remove('copied');
      btn.innerHTML = originalHTML;
    }, 1500);
  };
</script>
